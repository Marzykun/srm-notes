<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SRM Notes Hub</title>
  <meta name="description" content="Notes, PYQs and study material for every SRMIST semester, shared by seniors.">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 8h10l4 4v12H9z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SRM Notes Hub</span>
      </a>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search subjects or notes…" autocomplete="off" aria-label="Search">
        <kbd class="search-kbd">/</kbd>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer container">
    <p>Notes shared by SRM seniors, for juniors. Have notes to add? Reach out and we'll put them up.</p>
    <p class="credits" id="credits"></p>
  </footer>

  <dialog id="viewer" class="viewer">
    <div class="viewer-bar">
      <button class="icon-btn" data-close aria-label="Close viewer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="viewer-title" id="viewer-title"></div>
      <a class="btn btn-ghost" id="viewer-open" target="_blank" rel="noopener">Open in Drive</a>
    </div>
    <div class="viewer-body">
      <div class="viewer-loading">Loading preview…</div>
      <iframe id="viewer-frame" title="Document preview" allow="autoplay" referrerpolicy="no-referrer"></iframe>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
